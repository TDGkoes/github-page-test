<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img"><title>지식 구조 비교</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#999" stroke-width="1.2"/></marker></defs><rect x="1" y="1" width="958" height="543" rx="20" fill="white" stroke="#e7e7e7"/><g font-family="Malgun Gothic, sans-serif"><rect x="18" y="16" width="924" height="76" rx="14" fill="#f6f6f6"/><text x="480.0" y="47" text-anchor="middle" font-size="20" fill="#292929" font-weight="700">지식 구조 비교</text><text x="480.0" y="73" text-anchor="middle" font-size="15" fill="#858585" font-weight="400">공통 자료를 어디에 두고, 업무별 자료를 어떻게 나눌 것인가?</text><rect x="18" y="112" width="288" height="376" rx="14" fill="white" stroke="#e6e6e6"/><text x="162" y="143" text-anchor="middle" font-size="18" fill="#292929" font-weight="700">A. 모든 자료 통합</text><rect x="336" y="112" width="288" height="376" rx="14" fill="white" stroke="#e6e6e6"/><text x="480" y="143" text-anchor="middle" font-size="18" fill="#292929" font-weight="700">B. 업무별 분리</text><rect x="654" y="112" width="288" height="376" rx="14" fill="white" stroke="#e6e6e6"/><text x="798" y="143" text-anchor="middle" font-size="18" fill="#292929" font-weight="700">C. 공통 + 업무별 분리</text><rect x="38" y="172" width="248" height="220" rx="12" fill="#f6f6f6" stroke="#e6e6e6"/><text x="162.0" y="200" text-anchor="middle" font-size="17" fill="#292929" font-weight="700">통합 폴더</text><text x="162.0" y="225" text-anchor="middle" font-size="15" fill="#777" font-weight="400">인력 자료</text><text x="162.0" y="250" text-anchor="middle" font-size="15" fill="#777" font-weight="400">제안 참고 자료</text><text x="162.0" y="275" text-anchor="middle" font-size="15" fill="#777" font-weight="400">WBS 참고 자료</text><text x="162" y="433" text-anchor="middle" font-size="15" fill="#777" font-weight="400">자료를 한곳에서 관리</text><text x="162" y="460" text-anchor="middle" font-size="14" fill="#777" font-weight="400">소규모·동일 접근 범위</text><rect x="356" y="172" width="248" height="72" rx="12" fill="white" stroke="#e6e6e6"/><text x="480.0" y="200" text-anchor="middle" font-size="17" fill="#292929" font-weight="700">분석 폴더</text><text x="480.0" y="225" text-anchor="middle" font-size="15" fill="#777" font-weight="400">인력 자료</text><rect x="356" y="255" width="248" height="72" rx="12" fill="white" stroke="#e6e6e6"/><text x="480.0" y="283" text-anchor="middle" font-size="17" fill="#292929" font-weight="700">제안 폴더</text><text x="480.0" y="308" text-anchor="middle" font-size="15" fill="#777" font-weight="400">인력 자료 사본 + 제안 사례</text><rect x="356" y="338" width="248" height="72" rx="12" fill="white" stroke="#e6e6e6"/><text x="480.0" y="366" text-anchor="middle" font-size="17" fill="#292929" font-weight="700">WBS 폴더</text><text x="480.0" y="391" text-anchor="middle" font-size="15" fill="#777" font-weight="400">인력 자료 사본 + WBS 사례</text><text x="480" y="445" text-anchor="middle" font-size="14" fill="#777" font-weight="400">업무별 관리 · 공통 자료 중복 가능</text><rect x="674" y="172" width="248" height="72" rx="12" fill="#f6f6f6" stroke="#e6e6e6"/><text x="798.0" y="200" text-anchor="middle" font-size="17" fill="#292929" font-weight="700">공통 폴더</text><text x="798.0" y="225" text-anchor="middle" font-size="15" fill="#777" font-weight="400">인력 자료 한 번 관리</text><text x="798" y="273" text-anchor="middle" font-size="15" fill="#00b83f" font-weight="400">분석·제안·WBS가 함께 조회</text><rect x="674" y="295" width="248" height="62" rx="12" fill="white" stroke="#e6e6e6"/><text x="798.0" y="323" text-anchor="middle" font-size="17" fill="#292929" font-weight="700">제안 폴더</text><text x="798.0" y="348" text-anchor="middle" font-size="15" fill="#777" font-weight="400">제안 참고 자료</text><rect x="674" y="370" width="248" height="62" rx="12" fill="white" stroke="#e6e6e6"/><text x="798.0" y="398" text-anchor="middle" font-size="17" fill="#292929" font-weight="700">WBS 폴더</text><text x="798.0" y="423" text-anchor="middle" font-size="15" fill="#777" font-weight="400">WBS 참고 자료</text><text x="798" y="464" text-anchor="middle" font-size="15" fill="#00b83f" font-weight="700">현재 에이전트에 적용</text><text x="480" y="521" text-anchor="middle" font-size="15" fill="#777" font-weight="400">폴더 분리와 별도로 연결 범위 · 설명 · 접근 권한 · 검색 결과를 확인</text></g></svg>