<svg xmlns="http://www.w3.org/2000/svg" width="880" height="680" viewBox="0 0 880 680" role="img"><title>진단 예 — 제안서에서 추천 인력 이름이 빠졌다면</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#999" stroke-width="1.2"/></marker></defs><rect x="1" y="1" width="878" height="678" rx="20" fill="white" stroke="#e7e7e7"/><g font-family="Malgun Gothic, sans-serif"><rect x="18" y="16" width="844" height="76" rx="14" fill="#f6f6f6"/><text x="440.0" y="47" text-anchor="middle" font-size="20" fill="#292929" font-weight="700">진단 예 — 제안서에서 추천 인력 이름이 빠졌다면</text><text x="440.0" y="73" text-anchor="middle" font-size="15" fill="#858585" font-weight="400">분석 출력 · 제안서 입력 · 최종 결과를 실행 기록과 함께 대조</text><rect x="35" y="126" width="420" height="77" rx="12" fill="white" stroke="#e6e6e6"/><text x="245.0" y="154" text-anchor="middle" font-size="17" fill="#292929" font-weight="700">분석 결과에 이름·근거가 있는가?</text><text x="245.0" y="179" text-anchor="middle" font-size="15" fill="#777" font-weight="400">원문·검색 결과와 분석 출력 대조</text><rect x="535" y="126" width="310" height="77" rx="12" fill="white" stroke="#e6e6e6"/><text x="690.0" y="154" text-anchor="middle" font-size="17" fill="#292929" font-weight="700">인력 자료·검색부터 확인</text><text x="690.0" y="179" text-anchor="middle" font-size="15" fill="#777" font-weight="400">자료 내용·조회 결과·분석 반영</text><path d="M456 165 H528" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="0" marker-end="url(#a)"/><text x="493" y="153" text-anchor="middle" font-size="14" fill="#777" font-weight="400">없음</text><rect x="35" y="267" width="420" height="77" rx="12" fill="white" stroke="#e6e6e6"/><text x="245.0" y="295" text-anchor="middle" font-size="17" fill="#292929" font-weight="700">제안서 입력에 이름이 있는가?</text><text x="245.0" y="320" text-anchor="middle" font-size="15" fill="#777" font-weight="400">전달되거나 조회된 선행 결과 확인</text><path d="M245 204 V260" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="0" marker-end="url(#a)"/><text x="270" y="237" text-anchor="middle" font-size="14" fill="#00b83f" font-weight="400">있음</text><rect x="535" y="267" width="310" height="77" rx="12" fill="white" stroke="#e6e6e6"/><text x="690.0" y="295" text-anchor="middle" font-size="17" fill="#292929" font-weight="700">단계 간 인계 보완</text><text x="690.0" y="320" text-anchor="middle" font-size="15" fill="#777" font-weight="400">필요한 값·조회 가능한 결과 전달</text><path d="M456 305 H528" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="0" marker-end="url(#a)"/><text x="493" y="294" text-anchor="middle" font-size="14" fill="#777" font-weight="400">없음</text><rect x="35" y="408" width="420" height="77" rx="12" fill="white" stroke="#e6e6e6"/><text x="245.0" y="436" text-anchor="middle" font-size="17" fill="#292929" font-weight="700">제안서 Skill의 반영·검증 보완</text><text x="245.0" y="461" text-anchor="middle" font-size="15" fill="#777" font-weight="400">입력에는 있지만 제안서에서 누락</text><path d="M245 345 V401" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="0" marker-end="url(#a)"/><text x="270" y="378" text-anchor="middle" font-size="14" fill="#00b83f" font-weight="400">있음</text><path d="M845 165 H861 V526 H750 V542" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="0" marker-end="url(#a)"/><path d="M845 305 H861" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="0" marker-end="url(#a)"/><path d="M245 486 V542" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="0" marker-end="url(#a)"/><rect x="35" y="550" width="810" height="70" rx="12" fill="#f6f6f6" stroke="#e6e6e6"/><text x="440.0" y="578" text-anchor="middle" font-size="17" fill="#292929" font-weight="700">같은 입력으로 재생성하고 후속 영향 검증</text><text x="440.0" y="603" text-anchor="middle" font-size="15" fill="#777" font-weight="400">제안서와 상세 WBS의 실명 · Level · 가용성 상태 확인</text><text x="440" y="655" text-anchor="middle" font-size="15" fill="#777" font-weight="400">모든 지침을 늘리기보다, 처음 정보가 사라진 지점의 구성을 수정</text></g></svg>