<svg xmlns="http://www.w3.org/2000/svg" width="910" height="435" viewBox="0 0 910 435" role="img"><title>Agentic Loop — 하나의 요청을 처리하는 과정</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#999" stroke-width="1.2"/></marker></defs><rect x="1" y="1" width="908" height="433" rx="20" fill="white" stroke="#e7e7e7"/><g font-family="Malgun Gothic, sans-serif"><rect x="18" y="16" width="874" height="76" rx="14" fill="#f6f6f6"/><text x="455.0" y="47" text-anchor="middle" font-size="20" fill="#292929" font-weight="700">Agentic Loop — 하나의 요청을 처리하는 과정</text><text x="455.0" y="73" text-anchor="middle" font-size="15" fill="#858585" font-weight="400">업무 단계의 연결과 구분하며, 요청한 범위까지 수행</text><rect x="30" y="130" width="150" height="78" rx="12" fill="white" stroke="#e6e6e6"/><text x="105.0" y="158" text-anchor="middle" font-size="17" fill="#292929" font-weight="700">요청 분석</text><text x="105.0" y="183" text-anchor="middle" font-size="15" fill="#777" font-weight="400">목표·범위 확인</text><rect x="205" y="130" width="150" height="78" rx="12" fill="white" stroke="#e6e6e6"/><text x="280.0" y="158" text-anchor="middle" font-size="17" fill="#292929" font-weight="700">처리 계획</text><text x="280.0" y="183" text-anchor="middle" font-size="15" fill="#777" font-weight="400">작업·순서 설계</text><rect x="380" y="130" width="150" height="78" rx="12" fill="white" stroke="#e6e6e6"/><text x="455.0" y="158" text-anchor="middle" font-size="17" fill="#292929" font-weight="700">Skill·도구 선택</text><text x="455.0" y="183" text-anchor="middle" font-size="15" fill="#777" font-weight="400">절차·실행 수단</text><rect x="555" y="130" width="150" height="78" rx="12" fill="white" stroke="#e6e6e6"/><text x="630.0" y="158" text-anchor="middle" font-size="17" fill="#292929" font-weight="700">실행</text><text x="630.0" y="183" text-anchor="middle" font-size="15" fill="#777" font-weight="400">자료 조회·작성</text><rect x="730" y="130" width="150" height="78" rx="12" fill="white" stroke="#e6e6e6"/><text x="805.0" y="158" text-anchor="middle" font-size="17" fill="#292929" font-weight="700">결과 검증</text><text x="805.0" y="183" text-anchor="middle" font-size="15" fill="#777" font-weight="400">완료 기준 충족?</text><path d="M182 169 H200" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="0" marker-end="url(#a)"/><path d="M357 169 H375" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="0" marker-end="url(#a)"/><path d="M532 169 H550" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="0" marker-end="url(#a)"/><path d="M707 169 H725" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="0" marker-end="url(#a)"/><rect x="730" y="300" width="150" height="65" rx="12" fill="#f6f6f6" stroke="#e6e6e6"/><text x="805.0" y="328" text-anchor="middle" font-size="17" fill="#292929" font-weight="700">결과 제공</text><path d="M805 209 V293" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="0" marker-end="url(#a)"/><text x="829" y="258" text-anchor="middle" font-size="14" fill="#00b83f" font-weight="400">충족</text><rect x="240" y="300" width="390" height="65" rx="12" fill="#f6f6f6" stroke="#e6e6e6"/><text x="435.0" y="328" text-anchor="middle" font-size="17" fill="#292929" font-weight="700">원인에 맞는 단계 보완</text><path d="M765 209 V252 H435 V293" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="0" marker-end="url(#a)"/><text x="582" y="243" text-anchor="middle" font-size="14" fill="#777" font-weight="400">누락·오류</text><path d="M240 333 H55 V250 H280 V214" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="5" marker-end="url(#a)"/><text x="455" y="406" text-anchor="middle" font-size="15" fill="#777" font-weight="400">자료 재조회 · 계획 수정 · 재실행 등 필요한 단계부터 보완·재검증</text></g></svg>