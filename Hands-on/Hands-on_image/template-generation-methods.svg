<svg xmlns="http://www.w3.org/2000/svg" width="960" height="535" viewBox="0 0 960 535" role="img"><title>표준 양식을 적용하는 두 가지 작성 경로</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#999" stroke-width="1.2"/></marker></defs><rect x="1" y="1" width="958" height="533" rx="20" fill="white" stroke="#e7e7e7"/><g font-family="Malgun Gothic, sans-serif"><rect x="18" y="16" width="924" height="76" rx="14" fill="#f6f6f6"/><text x="480.0" y="47" text-anchor="middle" font-size="20" fill="#292929" font-weight="700">표준 양식을 적용하는 두 가지 작성 경로</text><text x="480.0" y="73" text-anchor="middle" font-size="15" fill="#858585" font-weight="400">표준 양식을 실제로 적용해 일관된 결과를 얻기 위한 선택</text><rect x="18" y="112" width="450" height="337" rx="14" fill="white" stroke="#e6e6e6"/><text x="243" y="145" text-anchor="middle" font-size="19" fill="#292929" font-weight="700">참고 후 새로 작성</text><rect x="68" y="169" width="350" height="64" rx="12" fill="white" stroke="#e6e6e6"/><text x="243.0" y="197" text-anchor="middle" font-size="17" fill="#292929" font-weight="700">동봉한 표준 템플릿 원본</text><path d="M243 234 V271" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="0" marker-end="url(#a)"/><rect x="492" y="112" width="450" height="337" rx="14" fill="white" stroke="#e6e6e6"/><text x="717" y="145" text-anchor="middle" font-size="19" fill="#292929" font-weight="700">복사 후 작성 — 현재 적용</text><rect x="542" y="169" width="350" height="64" rx="12" fill="white" stroke="#e6e6e6"/><text x="717.0" y="197" text-anchor="middle" font-size="17" fill="#292929" font-weight="700">동봉한 표준 템플릿 원본</text><path d="M717 234 V271" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="0" marker-end="url(#a)"/><text x="268" y="257" text-anchor="start" font-size="14" fill="#777" font-weight="400">양식 읽기·참고</text><text x="742" y="257" text-anchor="start" font-size="14" fill="#00b83f" font-weight="400">원본 파일 복사</text><rect x="68" y="278" width="350" height="70" rx="12" fill="white" stroke="#e6e6e6"/><text x="243.0" y="306" text-anchor="middle" font-size="17" fill="#292929" font-weight="700">새 파일에 양식을 재현</text><text x="243.0" y="331" text-anchor="middle" font-size="15" fill="#777" font-weight="400">내용·서식을 새로 구성</text><rect x="542" y="278" width="350" height="70" rx="12" fill="white" stroke="#e6e6e6"/><text x="717.0" y="306" text-anchor="middle" font-size="17" fill="#292929" font-weight="700">복사본의 내용 편집</text><text x="717.0" y="331" text-anchor="middle" font-size="15" fill="#777" font-weight="400">원본의 표준 요소 유지</text><text x="243" y="385" text-anchor="middle" font-size="16" fill="#777" font-weight="400">재현 과정에서 서식 차이 발생 가능</text><text x="717" y="385" text-anchor="middle" font-size="16" fill="#00b83f" font-weight="700">표준 양식 파일 자체에서 출발</text><text x="243" y="418" text-anchor="middle" font-size="15" fill="#777" font-weight="400">내용·서식 검증</text><text x="717" y="418" text-anchor="middle" font-size="15" fill="#777" font-weight="400">내용·서식 · 원본 불변 검증</text><text x="480" y="485" text-anchor="middle" font-size="15" fill="#777" font-weight="400">두 방식 모두 템플릿 동봉 · 차이는 Skill에서 지시하는 파일 작성 방법</text><text x="480" y="512" text-anchor="middle" font-size="15" fill="#777" font-weight="400">제안서는 양식을 유지하며 슬라이드 수 · 순서 · 내용을 조정</text></g></svg>